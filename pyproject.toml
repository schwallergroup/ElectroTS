[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "electro-ts"
version = "0.1.0"
description = "Long-horizon forecasting of electrolysis stability from early-stage operating data through temporal learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "torch>=2.0",
]

[project.scripts]
electro-ts = "electro_ts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["electro_ts"]
